<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel Ricardo Mello · Exponential</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<style>
  :root{
    --plane:#eef1f5;--surface:#fff;--surface-2:#f7f9fb;--ink:#0d1017;--ink-2:#535a66;--muted:#868d99;
    --border:rgba(13,16,23,.10);--border-2:rgba(13,16,23,.16);
    --accent:#2a78d6;--accent-ink:#1c5cab;--accent-wash:rgba(42,120,214,.10);
    --good:#0ca30c;--good-ink:#0a7c0a;--good-wash:rgba(12,163,12,.11);
    --warn:#b4790a;--warn-wash:rgba(230,157,20,.14);
    --crit:#d03b3b;--crit-ink:#b32a2a;--crit-wash:rgba(208,59,59,.11);
    --grid:#e4e7ec;--axis:#c3c7cf;--area-top:rgba(42,120,214,.28);--area-bot:rgba(42,120,214,.02);
    --header:#12151b;--header-ink:#eef1f5;--header-sub:#9aa2af;
    --shadow:0 1px 2px rgba(13,16,23,.05),0 10px 28px rgba(13,16,23,.055);--r:14px;
  }
  @media (prefers-color-scheme:dark){:root{
    --plane:#0a0c10;--surface:#15181e;--surface-2:#1a1e25;--ink:#f1f3f7;--ink-2:#a7aeba;--muted:#7c838f;
    --border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.17);
    --accent:#3d8bea;--accent-ink:#82b4f1;--accent-wash:rgba(61,139,234,.16);
    --good:#28b828;--good-ink:#54cf54;--good-wash:rgba(40,184,40,.16);
    --warn:#e0a52a;--warn-wash:rgba(224,165,42,.16);--crit:#e86b6b;--crit-ink:#f08a8a;--crit-wash:rgba(232,107,107,.16);
    --grid:#282c33;--axis:#3a3f48;--area-top:rgba(61,139,234,.34);--area-bot:rgba(61,139,234,.02);
    --header:#0d0f13;--header-ink:#eef1f5;--header-sub:#8b93a0;--shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{--plane:#0a0c10;--surface:#15181e;--surface-2:#1a1e25;--ink:#f1f3f7;--ink-2:#a7aeba;--muted:#7c838f;--border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.17);--accent:#3d8bea;--accent-ink:#82b4f1;--accent-wash:rgba(61,139,234,.16);--good:#28b828;--good-ink:#54cf54;--good-wash:rgba(40,184,40,.16);--warn:#e0a52a;--warn-wash:rgba(224,165,42,.16);--crit:#e86b6b;--crit-ink:#f08a8a;--crit-wash:rgba(232,107,107,.16);--grid:#282c33;--axis:#3a3f48;--area-top:rgba(61,139,234,.34);--area-bot:rgba(61,139,234,.02);--header:#0d0f13;--header-ink:#eef1f5;--header-sub:#8b93a0;--shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);}
  :root[data-theme="light"]{--plane:#eef1f5;--surface:#fff;--surface-2:#f7f9fb;--ink:#0d1017;--ink-2:#535a66;--muted:#868d99;--border:rgba(13,16,23,.10);--border-2:rgba(13,16,23,.16);--accent:#2a78d6;--accent-ink:#1c5cab;--accent-wash:rgba(42,120,214,.10);--good:#0ca30c;--good-ink:#0a7c0a;--good-wash:rgba(12,163,12,.11);--warn:#b4790a;--warn-wash:rgba(230,157,20,.14);--crit:#d03b3b;--crit-ink:#b32a2a;--crit-wash:rgba(208,59,59,.11);--grid:#e4e7ec;--axis:#c3c7cf;--area-top:rgba(42,120,214,.28);--area-bot:rgba(42,120,214,.02);--header:#12151b;--header-ink:#eef1f5;--header-sub:#9aa2af;--shadow:0 1px 2px rgba(13,16,23,.05),0 10px 28px rgba(13,16,23,.055);}

  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:1320px;margin:0 auto;padding:0 22px 72px}
  header.top{background:var(--header);color:var(--header-ink);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.06)}
  .top-in{max-width:1320px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .raven{width:32px;height:32px}
  .brand h1{font-size:14.5px;margin:0;font-weight:650;letter-spacing:.2px}
  .brand .sub{font-size:11.5px;color:var(--header-sub);margin-top:1px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .mi{font-size:11px;color:var(--header-sub);line-height:1.25}
  .mi b{display:block;color:var(--header-ink);font-size:12px;font-weight:600}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--header-sub)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-wash)}
  .tbtn{background:rgba(255,255,255,.08);color:var(--header-ink);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .tbtn:hover{background:rgba(255,255,255,.15)}

  .controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:20px 0 16px}
  .seg{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:4px;box-shadow:var(--shadow);flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:550;padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .seg button .cnt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .seg button:hover{background:var(--surface-2);color:var(--ink)}
  .seg button[aria-selected="true"]{background:var(--accent);color:#fff}
  .seg button[aria-selected="true"] .cnt{color:rgba(255,255,255,.82)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:650;padding-left:2px}
  select{font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--border-2);border-radius:9px;padding:9px 12px;cursor:pointer;min-width:180px;box-shadow:var(--shadow)}
  .spacer{flex:1}
  .periodseg{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:4px;box-shadow:var(--shadow)}
  .periodseg button{border:0;background:transparent;color:var(--ink-2);font-family:inherit;font-size:12px;font-weight:600;padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .periodseg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
  .daterange{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:4px 9px;box-shadow:var(--shadow)}
  .daterange input[type=date]{font-family:inherit;font-size:12px;color:var(--ink);background:transparent;border:0;border-radius:7px;padding:6px 4px;cursor:pointer;color-scheme:light dark}
  .daterange input[type=date]:focus{outline:2px solid var(--accent);outline-offset:1px}
  .daterange .sep{font-size:11px;color:var(--muted)}
  .daterange.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .funseg{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:4px;box-shadow:var(--shadow);flex-wrap:wrap}
  .funseg button{border:0;background:transparent;color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:550;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .funseg button:hover{background:var(--surface-2);color:var(--ink)}
  .funseg button[aria-selected="true"]{background:var(--accent);color:#fff}

  .kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:4px}
  .kpi .v{font-size:19px;font-weight:680;margin-top:5px;letter-spacing:-.4px}
  .kpi .s{font-size:10.5px;color:var(--ink-2);margin-top:2px}
  .info{width:13px;height:13px;border-radius:50%;border:1px solid var(--border-2);color:var(--muted);font-size:9px;display:inline-flex;align-items:center;justify-content:center;cursor:help;font-weight:700}
  .help{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--border-2);color:var(--muted);font-size:9.5px;font-weight:700;cursor:help;vertical-align:middle;flex:0 0 auto;transition:color .15s,border-color .15s;}
  .help:hover{color:var(--accent-ink);border-color:var(--accent);}
  thead th .help,.gm .help{margin-left:3px;}

  .obj{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:14px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .obj.warn{border-left-color:var(--warn)}.obj.good{border-left-color:var(--good)}
  .obj .eye{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .obj .ttl{font-size:17px;font-weight:650;margin:3px 0 2px;letter-spacing:-.2px}
  .obj .nt{font-size:12.5px;color:var(--ink-2);max-width:74ch}
  .obj .big{margin-left:auto;text-align:right}
  .obj .big .v{font-size:28px;font-weight:700;letter-spacing:-.5px}
  .obj .big .l{font-size:11px;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;padding:3px 9px;border-radius:999px}
  .pill.good{background:var(--good-wash);color:var(--good-ink)}.pill.warn{background:var(--warn-wash);color:var(--warn)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .phead h3{font-size:13.5px;font-weight:650;margin:0}
  .psub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .miniseg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
  .miniseg button{border:0;background:transparent;color:var(--ink-2);font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer}
  .miniseg button[aria-selected="true"]{background:var(--accent);color:#fff}
  svg.trend{width:100%;height:auto;display:block}
  .tt{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border-2);border-radius:9px;box-shadow:var(--shadow);padding:8px 11px;font-size:11.5px;opacity:0;transition:opacity .1s;z-index:30}
  .tt .d{color:var(--muted);font-size:10.5px;margin-bottom:2px}.tt .m{font-weight:650;font-size:13px;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .grid2 .panel{margin-bottom:0}
  .funnel{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .fstage{display:grid;grid-template-columns:132px 1fr 160px;align-items:center;gap:14px}
  .fstage .flabel{font-size:13px;font-weight:650}
  .ftrack{height:30px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .ffill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-ink));border-radius:6px 7px 7px 6px;min-width:3px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .fright{text-align:right}
  .fval{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .frate{display:block;font-size:10.5px;color:var(--muted)}
  .fann{font-size:11px;color:var(--accent-ink);padding:1px 0 1px 146px;line-height:1.5}
  .fann b{color:var(--ink)}
  .bar-row{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:10px;margin-bottom:10px}
  .bar-row .lbl{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{height:19px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--border)}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px 5px 5px 4px;min-width:3px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .bar-row .val{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

  .tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .tblhead{padding:16px 20px 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .tblhead h3{font-size:14px;margin:0;font-weight:650}
  .tblhead .sub{font-size:11.5px;color:var(--muted)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:650;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none}
  thead th:first-child{text-align:left}
  thead th.sorted{color:var(--accent-ink)}
  tbody td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody td:first-child{text-align:left;white-space:normal;min-width:210px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.best,tbody tr.best:hover{background:var(--accent-wash)}
  .crn{font-weight:550;display:flex;align-items:center;gap:8px}
  .cfull{font-size:12px;font-weight:600;color:var(--ink);word-break:break-word;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:-.2px}
  .star{color:var(--accent-ink);font-size:10px;font-weight:700;background:var(--accent-wash);padding:2px 7px;border-radius:999px;flex:0 0 auto}
  .tag{font-size:10px;color:var(--muted)}
  .st{font-size:10px;font-weight:650;padding:2px 8px;border-radius:999px}
  .st.on{background:var(--good-wash);color:var(--good-ink)}.st.off{background:rgba(134,141,153,.16);color:var(--muted)}
  .bk{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-wash);color:var(--accent-ink)}
  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}
  .mini{font-size:10px;color:var(--muted)}
  .notes{margin-top:20px;font-size:11.5px;color:var(--muted);line-height:1.65}
  .notes b{color:var(--ink-2)}.notes .row{display:flex;gap:8px;padding:3px 0}.notes .row span:first-child{color:var(--accent-ink);flex:0 0 auto}
  .err{background:var(--crit-wash);color:var(--crit-ink);border:1px solid var(--crit);border-radius:12px;padding:14px 18px;font-size:13px;margin:20px 0}
  @media (max-width:1080px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr}}
  @media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.obj .big{margin-left:0;text-align:left}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="skin">
  /* ===== EXPONENTIAL · terminal de crescimento — ouro sobre tinta ===== */
  :root{
    --font-display:"Fraunces",Georgia,"Times New Roman",serif;
    --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* light — papel quente + ouro profundo */
    --plane:#efece3;--surface:#faf8f2;--surface-2:#f3f0e7;--ink:#17150d;--ink-2:#55524a;--muted:#8c897c;
    --border:rgba(23,21,13,.11);--border-2:rgba(23,21,13,.18);
    --accent:#bd8419;--accent-ink:#9a6a12;--accent-wash:rgba(189,132,25,.12);
    --good:#1c9a5b;--good-ink:#157043;--good-wash:rgba(28,154,91,.12);
    --warn:#bd6a16;--warn-wash:rgba(189,106,22,.14);
    --crit:#c33f2d;--crit-ink:#9e3122;--crit-wash:rgba(195,63,45,.12);
    --grid:#e4dfd0;--axis:#cbc4b1;--area-top:rgba(189,132,25,.24);--area-bot:rgba(189,132,25,.02);
    --header:#131109;--header-ink:#f4f1e9;--header-sub:#9c9788;
    --shadow:0 1px 2px rgba(23,21,13,.05),0 16px 40px rgba(23,21,13,.07);--r:16px;
  }
  @media (prefers-color-scheme:dark){:root{
    --plane:#0a0b0f;--surface:#12141a;--surface-2:#191c24;--ink:#f4f1e9;--ink-2:#a7a595;--muted:#6f6d61;
    --border:rgba(244,241,233,.09);--border-2:rgba(244,241,233,.17);
    --accent:#e8b84b;--accent-ink:#f2ce74;--accent-wash:rgba(232,184,75,.13);
    --good:#54c98a;--good-ink:#7bdaa6;--good-wash:rgba(84,201,138,.15);
    --warn:#e08a37;--warn-wash:rgba(224,138,55,.17);
    --crit:#e35d50;--crit-ink:#ef8377;--crit-wash:rgba(227,93,80,.15);
    --grid:#20222a;--axis:#31343e;--area-top:rgba(232,184,75,.24);--area-bot:rgba(232,184,75,.015);
    --header:#0b0c10;--header-ink:#f4f1e9;--header-sub:#8f8e80;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.42);
  }}
  :root[data-theme="dark"]{--plane:#0a0b0f;--surface:#12141a;--surface-2:#191c24;--ink:#f4f1e9;--ink-2:#a7a595;--muted:#6f6d61;--border:rgba(244,241,233,.09);--border-2:rgba(244,241,233,.17);--accent:#e8b84b;--accent-ink:#f2ce74;--accent-wash:rgba(232,184,75,.13);--good:#54c98a;--good-ink:#7bdaa6;--good-wash:rgba(84,201,138,.15);--warn:#e08a37;--warn-wash:rgba(224,138,55,.17);--crit:#e35d50;--crit-ink:#ef8377;--crit-wash:rgba(227,93,80,.15);--grid:#20222a;--axis:#31343e;--area-top:rgba(232,184,75,.24);--area-bot:rgba(232,184,75,.015);--header:#0b0c10;--header-ink:#f4f1e9;--header-sub:#8f8e80;--shadow:0 1px 2px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.42);}
  :root[data-theme="light"]{--plane:#efece3;--surface:#faf8f2;--surface-2:#f3f0e7;--ink:#17150d;--ink-2:#55524a;--muted:#8c897c;--border:rgba(23,21,13,.11);--border-2:rgba(23,21,13,.18);--accent:#bd8419;--accent-ink:#9a6a12;--accent-wash:rgba(189,132,25,.12);--good:#1c9a5b;--good-ink:#157043;--good-wash:rgba(28,154,91,.12);--warn:#bd6a16;--warn-wash:rgba(189,106,22,.14);--crit:#c33f2d;--crit-ink:#9e3122;--crit-wash:rgba(195,63,45,.12);--grid:#e4dfd0;--axis:#cbc4b1;--area-top:rgba(189,132,25,.24);--area-bot:rgba(189,132,25,.02);--header:#131109;--header-ink:#f4f1e9;--header-sub:#9c9788;--shadow:0 1px 2px rgba(23,21,13,.05),0 16px 40px rgba(23,21,13,.07);}

  body{font-family:var(--font-ui);letter-spacing:-.006em;
    background:
      radial-gradient(120% 70% at 50% -12%, var(--accent-wash), transparent 60%),
      var(--plane);}
  /* grão sutil por cima de tudo */
  body::after{content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:.03;mix-blend-mode:overlay;

  /* tipografia — serifa editorial nos títulos, mono nos números */

  .kpi .k,.obj .eye,.field label,.psub,thead th{font-family:var(--font-ui);}
  .kpi .v{font-size:22px;letter-spacing:-.4px;}

  /* header — brasão + brilho dourado */
  header.top{position:relative;overflow:hidden;}
  header.top::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 240% at 14% -60%, rgba(232,184,75,.16), transparent 55%);}
  .top-in{position:relative;padding:16px 22px;}

  /* superfícies com mais ar e profundidade */

  .fstage .flabel{font-family:var(--font-ui);font-weight:600;letter-spacing:-.01em;}

  /* detalhes */

  /* galeria de criativos */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;padding:16px 20px 20px;}
  .gcard{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;}

  .gthumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:40px;color:var(--accent-ink);background:radial-gradient(130% 130% at 28% 18%,var(--accent-wash),transparent 60%);}

  /* link "Ver anúncio" (pré-visualização da Meta) */
  .adlink{display:inline-flex;align-items:center;gap:3px;margin-top:5px;padding:2px 8px;border:1px solid var(--border);border-radius:7px;font-size:11px;font-weight:600;color:var(--accent-ink);text-decoration:none;white-space:nowrap;}

  .gm .gk{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  .gm .gv{font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:-.3px;}
</style>
<style id="exec">

<style>

<body>

    </div>
  </div>

<div class="wrap"><div id="app"></div></div>
<div class="tt" id="tt"></div>
<script>
const BRL=n=>"R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const BRL0=n=>"R$ "+Math.round(n||0).toLocaleString("pt-BR");
const NUM=n=>(n||0).toLocaleString("pt-BR");
const PCT=n=>(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
const DEC=n=>(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
// glossário — explicações simples p/ o cliente (sem aspas duplas nos textos)
const GLOSS={
  ctr:"CTR (taxa de cliques): de cada 100 pessoas que viram o anúncio, quantas clicaram. Quanto maior, mais o criativo chama atenção.",
  cpc:"CPC (custo por clique): quanto você paga, em média, por cada clique no anúncio.",
  cpm:"CPM (custo por mil): quanto custa para o anúncio aparecer 1.000 vezes na tela.",
  hook:"Hook rate: de quem começou a ver o vídeo, quantos assistiram os 3 primeiros segundos. Mede se o começo prende a atenção.",
  thruplay:"ThruPlay: reproduções do vídeo até o fim (ou por pelo menos 15 segundos).",
  connect:"Taxa de conexão: de quem clicou no anúncio, quantos realmente abriram a página de destino. Mede se a página carrega e conecta.",
  pageview:"Page view (visualização da página): pessoas que abriram a página de destino depois de clicar no anúncio.",
  checkout:"Checkout: pessoas que iniciaram a finalização da compra (foram para o carrinho ou pagamento).",
  lead:"Lead: um possível cliente que deixou o contato (formulário, WhatsApp).",
  lead_quali:"Lead quali (pixel): evento personalizado lead_quali disparado pelo pixel da Meta quando o formulário indica perfil de cliente. É contado no navegador; o qualificado da RD (aba CRM) é contado no cadastro que chegou ao sistema.",
  cpl:"CPL (custo por lead): investimento dividido pelo número de leads gerados. Quanto menor, melhor.",
  compra:"Compra: vendas atribuídas ao anúncio pelo pixel da Meta.",
  freq:"Frequência: em média, quantas vezes cada pessoa viu o anúncio no período.",
  alcance:"Alcance: número de pessoas únicas que viram o anúncio (diferente de impressões, que contam repetições).",
  impressoes:"Impressões: quantas vezes o anúncio apareceu na tela (pode repetir para a mesma pessoa).",
  objetivo:"Objetivo: o resultado principal da campanha (compra, lead, visita ao perfil…), lido pela nomenclatura do nome.",
  retencao:"Retenção do vídeo: quantas pessoas continuaram assistindo até 25%, 50%, 75% e 95% da duração.",
  seguidores:"Curtidas FB: curtidas/seguidores da Página do Facebook atribuídos aos anúncios. NÃO é o seguidor do Instagram (a Meta não fornece esse pela API).",
  status:"Status: se está ativo (rodando agora) ou pausado.",
  acao:"Ação: o tipo de campanha (Vendas, Conteúdo, Seguidores, Leads, WhatsApp, Tráfego), identificado pela nomenclatura.",
  visitasperfil:"Visitas ao perfil: pessoas que foram ao perfil do Instagram após o anúncio (indicador de crescimento de seguidores).",
  rd_lead:"Leads na RD: pessoas que se cadastraram e chegaram à RD Station no período (uma por pessoa e por funil). Pode diferir do lead do pixel: o pixel conta eventos no navegador, a RD conta cadastros que chegaram ao sistema.",
  rd_quali:"Qualificado na RD: campo Lead qualificado = SIM no cadastro da RD (régua de faturamento do formulário). É diferente do lead_quali do pixel.",
  rd_dono:"Com dono no CRM: o lead virou card no RD Station CRM e tem um vendedor responsável. Lead sem dono não entra na fila de ninguém.",
  rd_avanco:"Avançaram: leads que já passaram da tentativa de contato no CRM (conectado, reunião, negociação, imersão ou venda).",
};
function hlp(k){const d=GLOSS[k];return d?` <span class="help" title="${d}" role="img" aria-label="ajuda">?</span>`:"";}
function hcol(k,l){const m={cpm:"cpm",ctr:"ctr",cpc:"cpc",hook:"hook",objV:"objetivo",status:"status",bucket:"acao",reach:"alcance",le:"lead",ql:"lead_quali",rdn:"rd_lead",rdq:"rd_quali",rdo:"rd_dono",rda:"rd_avanco"};return l+(m[k]?hlp(m[k]):"");}

const iso=d=>d.toISOString().slice(0,10);
const PRESETS=[["today","Hoje"],["yesterday","Ontem"],["last_7d","7 dias"],["last_30d","30 dias"],["last_90d","90 dias"]];
// funis: o mesmo filtro "Funil / oferta" vale para a Meta (nome da campanha) e para a RD (identificador da conversão)
const RDF={planilha:"Planilha DRE",dre_int:"DRE Inteligente",imersao:"Imersão",diagnostico:"Diagnóstico",whatsapp:"WhatsApp (botão da página)",outros:"Outros formulários"};
const RDKEY=Object.fromEntries(Object.entries(RDF).map(([k,v])=>[v,k]));
const PROD_ORDER=["Planilha DRE","DRE Inteligente","Imersão","Diagnóstico","Empresário c/ Tempo","Manual PME","Evento presencial","Perfil / Seguidores","Conteúdo Indústrias","WhatsApp (botão da página)","Outros formulários","Outros"];
const PRIMARY={vendas:{key:"pu",label:"Compras",unit:"compras",micro:true},conteudo:{key:"tp",label:"ThruPlays",unit:"ThruPlays",micro:false},seguidores:{key:"ig",label:"Visitas ao perfil",unit:"visitas",micro:false},leads:{key:"le",label:"Leads",unit:"leads",micro:false},whatsapp:{key:"msg",label:"Conversas",unit:"conversas",micro:false},trafego:{key:"lc",label:"Cliques no link",unit:"cliques",micro:false}};
const BUCKETS=["vendas","conteudo","seguidores","leads","whatsapp","trafego"];
const BKL={vendas:"Vendas",conteudo:"Conteúdo",seguidores:"Seguidores",leads:"Leads",whatsapp:"WhatsApp",trafego:"Tráfego"};

let DATA=null,CMETA={},ADMAP={},ADINFO={},state={action:"geral",product:"all",preset:"last_30d",from:null,to:null,level:"campaign",adView:"table",crmCols:true};
// filtros no endereço (#aba=crm&f=DRE%20Inteligente&p=last_30d) para mandar o link de uma visão
function readHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  const tabs=["resumo","geral","crm",...BUCKETS];
  if(tabs.includes(h.get("aba")))state.action=h.get("aba");
  state.product=h.get("f")||"all";
  if(h.get("p")&&PRESETS.some(p=>p[0]===h.get("p")))state.preset=h.get("p");
  else if(/^\d{4}-\d{2}-\d{2}$/.test(h.get("de")||"")&&/^\d{4}-\d{2}-\d{2}$/.test(h.get("ate")||"")){state.preset=null;state.from=h.get("de");state.to=h.get("ate");}
  crm.camp=h.get("camp")||"";
  crm.med=h.get("conj")||"";
}
// link colado com outro filtro na mesma aba do navegador: aplica sem recarregar
addEventListener("hashchange",()=>{if(!DATA)return;readHash();if(state.preset){const [f,t]=presetRange(state.preset);state.from=f;state.to=t;}render();});
function writeHash(){
  const h=new URLSearchParams();h.set("aba",state.action);
  if(state.product!=="all")h.set("f",state.product);
  if(state.preset)h.set("p",state.preset);else{h.set("de",state.from);h.set("ate",state.to);}
  if(state.action==="crm"){if(crm.camp)h.set("camp",crm.camp);if(crm.med)h.set("conj",crm.med);}
  history.replaceState(null,"","#"+h.toString());
}

function classify(cid){
  const c=CMETA[cid]||{name:cid,objective:""};
  const n=(c.name||"").toUpperCase(),o=c.objective||"";
  let b;
  if(/WHATS|MENSAG|MESSAG/.test(n))b="whatsapp";
  else if(/\bVV\b|THRUPLAY/.test(n)||o==="OUTCOME_ENGAGEMENT")b="conteudo";
  else if(/SEGUIDOR/.test(n))b="seguidores";
  else if(/LEAD/.test(n)||o==="OUTCOME_LEADS")b="leads";
  else if(/VENDAS|COMPRA|LOWTICKET|CHECKOUT/.test(n)||o==="OUTCOME_SALES")b="vendas";
  else if(/EVENTO|TRAFEGO|CLIQUES/.test(n)||o==="LINK_CLICKS")b="trafego";
  else b="trafego";
  let p="Outros";
  if(/DRE-?INTELIGENTE/.test(n))p="DRE Inteligente";
  else if(/PLANILHA/.test(n))p="Planilha DRE";
  else if(/DIAGNOSTICO/.test(n))p="Diagnóstico";
  else if(/EMPRESARIOCTEMPO|EMPRESARIO/.test(n))p="Empresário c/ Tempo";
  else if(/MANUALPME/.test(n))p="Manual PME";
  else if(/IMERSAO/.test(n))p="Imersão";
  else if(/LOWTICKET/.test(n))p="Empresário c/ Tempo";
  else if(/SEGUIDOR/.test(n))p="Perfil / Seguidores";
  else if(/EVENTO|REFORMATRIB/.test(n))p="Evento presencial";
  else if(/\bVV\b|INDUSTRIA/.test(n)&&b==="conteudo")p="Conteúdo Indústrias";
  return {bucket:b,product:p,name:c.name};
}
function adMetrics(a){
  const c=classify(a.campaign_id),v=a.vid||null,P=PRIMARY[c.bucket];
  return {...a,bucket:c.bucket,product:c.product,cname:c.name,
    ctr:a.impr?a.clicks/a.impr*100:0,cpc:a.clicks?a.spend/a.clicks:0,cpm:a.impr?a.spend/a.impr*1000:0,
    objV:a[P.key]||0,objLabel:P.label,
    hook:v&&a.impr?v.h/a.impr*100:null,thruRate:v&&a.impr?v.tp/a.impr*100:null};
}
function ads(){
  const rows=DATA.daily.filter(r=>r.d>=state.from&&r.d<=state.to),byAd={};
  for(const r of rows){if(!byAd[r.a]){const inf=ADINFO[r.a]||{};byAd[r.a]={ad_id:r.a,campaign_id:r.c,adset_id:r.as||inf.adset_id,name:inf.name||r.a,status:inf.status||"PAUSED",img:inf.img,link:inf.link,spend:0,impr:0,reach:0,clicks:0,le:0,ql:0,pu:0,co:0,lc:0,pv:0,ig:0,fo:0,tp:0,vid:null};}
  const o=byAd[r.a];o.spend+=r.s;o.impr+=r.i;o.reach+=r.rc;o.clicks+=r.ck;o.le+=r.le||0;o.ql+=r.ql||0;o.pu+=r.pu||0;o.co+=r.co||0;o.lc+=r.lc||0;o.pv+=r.pv||0;o.ig+=r.ig||0;o.fo+=r.fo||0;o.tp+=r.tp||0;
  if(r.vid){if(!o.vid)o.vid={h:0,tp:0,q25:0,q50:0,q75:0,q95:0};o.vid.h+=r.vid.h||0;o.vid.tp+=r.vid.tp||0;o.vid.q25+=r.vid.q25||0;o.vid.q50+=r.vid.q50||0;o.vid.q75+=r.vid.q75||0;o.vid.q95+=r.vid.q95||0;}}
  return Object.values(byAd).map(adMetrics);
}
function scoped(list){return list.filter(x=>(state.action==="geral"||x.bucket===state.action)&&(state.product==="all"||x.product===state.product));}
function campaignsAgg(list){
  const m={};
  list.forEach(a=>{const k=a.campaign_id;if(!m[k])m[k]={id:k,name:a.cname,bucket:a.bucket,product:a.product,spend:0,impr:0,reach:0,clicks:0,objV:0,fo:0,le:0,ql:0,anyActive:false};
    const c=m[k];c.spend+=a.spend;c.impr+=a.impr;c.reach+=a.reach;c.clicks+=a.clicks;c.objV+=a.objV;c.fo+=a.fo||0;c.le+=a.le||0;c.ql+=a.ql||0;if(a.status==="ACTIVE")c.anyActive=true;});
  return Object.values(m).map(c=>({...c,ctr:c.impr?c.clicks/c.impr*100:0,cpc:c.clicks?c.spend/c.clicks:0,cpm:c.impr?c.spend/c.impr*1000:0,objLabel:PRIMARY[c.bucket].label})).sort((a,b)=>b.spend-a.spend);
}
function adsetsAgg(list){
  const m={};
  list.forEach(a=>{const k=a.adset_id||"—";if(!m[k])m[k]={id:k,name:ADMAP[k]||("conjunto "+k),cname:a.cname,bucket:a.bucket,product:a.product,spend:0,impr:0,reach:0,clicks:0,objV:0,le:0,ql:0,anyActive:false};
    const c=m[k];c.spend+=a.spend;c.impr+=a.impr;c.reach+=a.reach;c.clicks+=a.clicks;c.objV+=a.objV;c.le+=a.le||0;c.ql+=a.ql||0;if(a.status==="ACTIVE")c.anyActive=true;});
  return Object.values(m).map(c=>({...c,ctr:c.impr?c.clicks/c.impr*100:0,cpc:c.clicks?c.spend/c.clicks:0,cpm:c.impr?c.spend/c.impr*1000:0,objLabel:PRIMARY[c.bucket].label})).sort((a,b)=>b.spend-a.spend);
}

function presetRange(k){

  switch(k){
    case "today":return [last,last];

    case "last_7d":return [back(7),last];

function journeyRows(meta,rd,spend){

function shortName(n){

  const DROP=new Set(["LEADS","VD","IMG","BRASIL","IC"]);
  const parts=s.replace(/^COR-[A-Z]-/i,"").replace(/-*\d{4}-\d{2}-\d{2}\s*$/,"").split(/-+/).filter(p=>p&&!DROP.has(p.toUpperCase()));

// (ex.: ...LISTACAIO-2026-10-01 virou ...LISTACOMPRADORES-2026-10-01), casa pelo conjunto (utm_medium) e pela data no fim do nome.
let RESOLVE={},ASCAMP=null;
function resolveCamp(term,med){
  if(!term||!DATA)return null;const k=term+"|"+(med||"");if(k in RESOLVE)return RESOLVE[k];
  metaMaps();
  if(!ASCAMP){ASCAMP={};DATA.ads.forEach(a=>{(ASCAMP[a.adset_id]||=new Set()).add(a.campaign_id);});}
  const t=nmz(term),m=nmz(med);
  let c=DATA.campaigns.filter(x=>CNAME[x.id]===t).map(x=>x.id);
  if(c.length!==1){
    let cand=new Set();
    if(m)Object.entries(ASNAME).forEach(([as,n])=>{if(n===m)(ASCAMP[as]||[]).forEach(id=>cand.add(id));});
    cand=[...cand];if(c.length>1)cand=cand.filter(id=>c.includes(id));
    const date=(t.match(/\d{4}-\d{2}-\d{2}$/)||[])[0];
    if(cand.length>1&&date)cand=cand.filter(id=>CNAME[id].endsWith(date));
    if(cand.length>1){const pre=t.split("-").slice(0,5).join("-");cand=cand.filter(id=>CNAME[id].startsWith(pre));}
    c=cand;
  }
  return RESOLVE[k]=c.length===1?c[0]:null;
}

function resolveSets(cid,med){metaMaps();const m=nmz(med);return cid&&m?Object.keys(ASNAME).filter(as=>ASNAME[as]===m&&ASCAMP[as]&&ASCAMP[as].has(cid)):[];}

function rdIndex(){
  const idx={c:{},s:{}};if(!RD)return idx;
  for(const [lead,ents] of rdScope().byLead){
    const sc=new Set(),ss=new Set();
    for(const e of ents){const cid=resolveCamp(e.term,e.med);if(!cid)continue;
      if(!sc.has(cid)){sc.add(cid);(idx.c[cid]||=[]).push(lead);}
      for(const as of resolveSets(cid,e.med))if(!ss.has(as)){ss.add(as);(idx.s[as]||=[]).push(lead);}}
  }
  return idx;
}

function exStage(name){
  const n=EXN(name);
  if(/(^|[^A-Z])C3([^A-Z]|$)/.test(n))return "c3";
  if(/(^|[^A-Z])C2([^A-Z]|$)/.test(n))return "c2";
  if(/(^|[^A-Z])C1([^A-Z]|$)/.test(n))return "c1";
  if(/DRE-?INTELIGENTE/.test(n))return "dreint";
  if(/PLANILHA/.test(n))return "plan";
  if(/DIAGNOSTICO/.test(n))return "diag";
  if(/IMERSAO/.test(n))return "imer";
  if(/(^|[^A-Z])LT([^A-Z]|$)/.test(n)||/LOW.?TICKET/.test(n))return "lt";
  if(/EVENTO/.test(n))return "evt";
  return "out";
}

function exAgg(list){
  const t={spend:0,impr:0,reach:0,clicks:0};
  list.forEach(a=>{t.spend+=a.spend;t.impr+=a.impr;t.reach+=a.reach;t.clicks+=a.clicks;});
  t.ctr=t.impr?t.clicks/t.impr*100:0;t.cpc=t.clicks?t.spend/t.clicks:0;t.cpm=t.impr?t.spend/t.impr*1000:0;
  return t;
}
// resultados da etapa, separados por tipo de objetivo (não somamos lead com compra)
function exResults(list){
  const m={};
  list.forEach(a=>{const b=a.bucket;if(!m[b])m[b]={bucket:b,spend:0,objV:0};m[b].spend+=a.spend;m[b].objV+=a.objV;});
  return Object.values(m).map(r=>({...r,label:PRIMARY[r.bucket].label,unit:PRIMARY[r.bucket].unit,cpr:r.objV?r.spend/r.objV:null}))
    .sort((a,b)=>b.spend-a.spend);
}
// semáforo: compara CTR, CPM e CPC da etapa com a média da conta no mesmo período
function exLight(s,main,avg){
  if(s.spend<=0)return {c:"s-off",t:"sem veiculação"};
  // sem nenhum resultado registrado nunca pode ficar verde
  if(main&&!main.objV)return s.spend>=300?{c:"s-bad",t:"precisa de atenção"}:{c:"s-mid",t:"ainda sem resultado"};
  const sc=(s.ctr>=avg.ctr?1:0)+(s.cpm<=avg.cpm?1:0)+(s.cpc<=avg.cpc?1:0);
  return sc>=2?{c:"s-good",t:"indo bem",sc}:sc===1?{c:"s-mid",t:"dá pra melhorar",sc}:{c:"s-bad",t:"precisa de atenção",sc};
}
const exList=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
function exDelta(v,ref,lowerIsBetter,fmt){
  if(!ref)return "";
  const d=(v-ref)/ref*100, better=lowerIsBetter?d<0:d>0;
  const arrow=d<0?"↓":"↑";
  return `<span class="${better?"ex-dn":"ex-up"}">${arrow} ${Math.abs(d).toLocaleString("pt-BR",{maximumFractionDigits:0})}%</span> vs média (${fmt(ref)})`;
}
function exSay(st,s,main,avg,lg){
  if(s.spend<=0)return `Nada foi investido nesta etapa no período escolhido. Troque o período (90 dias) para ver o histórico.`;
  const cheapCTR=s.ctr>=avg.ctr, cheapCPM=s.cpm<=avg.cpm;
  if(main&&!main.objV)
    return `Já foram <b>${BRL0(s.spend)}</b> investidos e o resultado principal (<b>${main.label.toLowerCase()}</b>) ainda não registrou nenhum disparo. Enquanto isso, olhamos o CTR (<b>${PCT(s.ctr)}</b>) para saber se o anúncio pelo menos desperta interesse.`;
  const cpr=main&&main.cpr!=null?`Cada ${main.unit.replace(/s$/,"")} custou <b>${BRLp(main.cpr)}</b>. `:"";
  if(lg.c==="s-good")
    return `${cpr}Esta etapa rende mais que a média da conta: ${cheapCTR?`mais gente clica aqui (<b>${PCT(s.ctr)}</b> contra ${PCT(avg.ctr)} da conta)`:`o custo de aparecer é menor (<b>${BRL(s.cpm)}</b> de CPM)`} e o dinheiro anda mais longe. É onde vale continuar colocando verba.`;
  if(lg.c==="s-mid")
    return cheapCPM
      ? `${cpr}Aparecer aqui está barato (CPM <b>${BRL(s.cpm)}</b>, abaixo da média), mas poucas pessoas clicam (CTR <b>${PCT(s.ctr)}</b>) — é o criativo que não está segurando a atenção. Trocar o gancho costuma resolver.`
      : `${cpr}O anúncio desperta interesse (CTR <b>${PCT(s.ctr)}</b>, acima da média), mas aparecer custa caro (CPM <b>${BRL(s.cpm)}</b>). Em campanha de formulário ou de venda isso é normal — o público é mais estreito. O número que decide aqui é o custo por resultado, não o CPM.`;
  return `${cpr}Esta é a etapa mais cara da conta agora: aparecer custa <b>${BRL(s.cpm)}</b> por mil pessoas, poucas clicam (CTR <b>${PCT(s.ctr)}</b>) e cada clique sai por <b>${BRL(s.cpc)}</b> — acima da média em todos os três. Vale trocar criativo ou público antes de aumentar a verba.`;
}

      : `<b>O que precisa de atenção:</b> nenhuma etapa está em alerta no período — todas rodam dentro ou abaixo do custo médio da conta.`);
  takes.push(`<b>O fundo do funil:</b> as campanhas de oferta (Imersão, Diagnóstico e Low Ticket) consumiram <b>${BRL0(oSp)}</b> — ${PCT(avg.spend?oSp/avg.spend*100:0)} da verba — e trouxeram <b>${NUM(oLe)} ${oLe===1?"contato":"contatos"}</b> e <b>${NUM(oPu)} ${oPu===1?"compra":"compras"}</b> registradas pelo pixel.`);

function stGroup(st){if(!st)return "none";if(/PERDID/i.test(st))return "lost";if(/VENDIDO|IMERS/i.test(st))return "won";if(/REUNI|NO SHOW|NEGOCIA/i.test(st))return "reun";if(/CONECTADO/i.test(st))return "conect";return "contato";}
const ESC={"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>ESC[c]);

const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);

function rdDecode(d){
  const D=d.dict||{},g=(f,i)=>(D[f]||[])[i]||"";
  const leads=d.leads.map(r=>({id:r[0],q:r[1],fat:g("fat",r[2]),seg:g("seg",r[3]),func:g("func",r[4]),st:g("st",r[5]),ow:g("ow",r[6]),lr:g("lr",r[7]),v:r[8]||0,prev:r[9],nc:r[10],last:r[11],rf:r[12]||"",ents:[]}));
  const entries=d.entries.map(r=>{const e={lead:leads[r[0]],f:g("f",r[1]),d:r[2],src:g("src",r[3]),cmp:g("cmp",r[4]),term:g("term",r[5]),med:g("med",r[6]),res:r[7],ph:r[8],nu:r[9],n:r[10]};e.lead.ents.push(e);return e;});
  leads.forEach(l=>{l.g=stGroup(l.st);});
  return {meta:d.meta,leads,entries};
}
function rdFunnelsInPeriod(){if(!RD)return [];const s=new Set(RD.entries.filter(e=>e.d>=state.from&&e.d<=state.to).map(e=>e.f));return FORDER.filter(f=>s.has(f));}
function rdFunnelSel(){return state.product==="all"?null:(RDKEY[state.product]||"__nenhum");}
// leads da RD no período e no funil escolhidos (um lead pode ter entrado por mais de um funil)
function rdScope(o={}){
  if(!RD)return {entries:[],leads:[],byLead:new Map()};
  const f=o.funnel!==undefined?o.funnel:rdFunnelSel();
  // campanha: aceita o nome da UTM ou o nome atual da campanha na Meta (campanha renomeada)
  const cOk=e=>{if(!o.camp)return true;const t=nmz(o.camp);if(nmz(e.term)===t)return true;const cid=resolveCamp(e.term,e.med);return !!cid&&CNAME[cid]===t;};
  const ents=RD.entries.filter(e=>e.d>=state.from&&e.d<=state.to&&(!f||e.f===f)&&(!o.med||nmz(e.med)===nmz(o.med))&&cOk(e));
  const byLead=new Map();ents.forEach(e=>{const x=byLead.get(e.lead);if(x)x.push(e);else byLead.set(e.lead,[e]);});
  return {entries:ents,leads:[...byLead.keys()],byLead};
}
function rdCounts(leads){
  const c={n:leads.length,q:0,own:0,adv:0,meet:0,won:0,lost:0,none:0};
  leads.forEach(l=>{if(l.q===1)c.q++;if(l.ow)c.own++;else c.none++;if(l.g==="conect"||l.g==="reun"||l.g==="won")c.adv++;if(l.g==="reun"||l.g==="won")c.meet++;if(l.g==="won")c.won++;if(l.g==="lost")c.lost++;});
  return c;
}
// faixa de faturamento em ordem (maior primeiro)
function fatRank(s){
  if(!s)return -1;const t=s.toLowerCase();
  const nums=[...t.matchAll(/(\d+(?:[.,]\d+)?)\s*(milh|mil)/g)].map(m=>parseFloat(m[1].replace(",","."))*(m[2]==="milh"?1e6:1e3));
  if(!nums.length)return 0;const mx=Math.max(...nums);return /acima/.test(t)?mx*10:mx;
}
let CPROD=null,CNAME=null,ASNAME=null;
function metaMaps(){if(CPROD)return;CPROD={};CNAME={};ASNAME={};DATA.campaigns.forEach(c=>{CPROD[c.id]=classify(c.id).product;CNAME[c.id]=nmz(c.name);});(DATA.adsets||[]).forEach(a=>{ASNAME[a.id]=nmz(a.name);});}
function spendWhere(fn){metaMaps();let s=0;for(const r of DATA.daily){if(r.d<state.from||r.d>state.to)continue;if(fn(r))s+=r.s;}return s;}
function crmStages(){
  const known=new Set(CRM_STAGES.map(s=>s.k)),extra=[...new Set(RD.leads.map(l=>l.st))].filter(k=>!known.has(k)).map(k=>({k,g:"Outra etapa"}));
  const i=CRM_STAGES.findIndex(s=>s.c==="won");return [...CRM_STAGES.slice(0,i),...extra,...CRM_STAGES.slice(i)];
}

// semanas de cadastro: barras empilhadas na ordem do processo (claro = início, escuro = imersão ou venda)
function renderCoorte(weeks,W){
  const el=document.getElementById("coorte");if(!el)return;
  if(!weeks.length){el.innerHTML=`<div class="empty">Nenhum lead neste recorte.</div>`;return;}
  const ORD=["won","reun","conect","contato","none","lost"]; // de baixo para cima
  const Wd=1000,H=260,ml=44,mr=12,mt=22,mb=30,pw=Wd-ml-mr,ph=H-mt-mb;
  const tot=w=>ORD.reduce((s,g)=>s+W[w][g],0),max=Math.max(...weeks.map(tot),1);
  const step=pw/weeks.length,bw=Math.min(56,step*0.62),y=v=>mt+ph-v/max*ph;
  let grid="";for(let i=0;i<=4;i++){const v=Math.round(max*i/4),yy=y(v);grid+=`<line x1="${ml}" x2="${Wd-mr}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--grid)"/><text x="${ml-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${NUM(v)}</text>`;}
  let bars="";
  weeks.forEach((w,i)=>{const x=ml+step*i+(step-bw)/2;let acc=0;const T=tot(w);
    ORD.forEach(g=>{const v=W[w][g];if(!v)return;const y0=y(acc),y1=y(acc+v),h=Math.max(y0-y1-2,1);acc+=v;
      bars+=`<rect class="cseg" x="${x.toFixed(1)}" y="${(y1+ (acc===T?0:0)).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${acc===T?4:1}" fill="${g==="none"?"url(#hatch)":`var(--o-${g})`}" data-w="${w}" data-g="${g}" data-v="${v}" data-t="${T}"/>`;});
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y(T)-6).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${NUM(T)}</text>`;
    if(weeks.length<=16||i%Math.ceil(weeks.length/12)===0)bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${DMY(w)}</text>`;});
  el.innerHTML=`<svg class="trend" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Leads por semana de cadastro, empilhados pela etapa atual">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface-2)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--o-none)" stroke-width="2.2"/></pattern></defs>
    ${grid}${bars}</svg>`;
  const tt=document.getElementById("tt");
  el.querySelectorAll(".cseg").forEach(r=>{
    r.addEventListener("mousemove",e=>{const d=r.dataset;tt.style.opacity="1";tt.style.left=Math.min(e.clientX+14,innerWidth-220)+"px";tt.style.top=(e.clientY-10)+"px";
      tt.innerHTML=`<div class="d">Semana de ${DMY(d.w)}</div><div class="m">${SGL[d.g]}: ${NUM(+d.v)}</div><div class="d">${PCT(d.v/d.t*100)} dos ${NUM(+d.t)} leads da semana</div>`;});
    r.addEventListener("mouseleave",()=>{tt.style.opacity="0";});
  });
}
// ---- senha da lista de leads (nome, e-mail e empresa criptografados no ramo rd-dados) ----
async function unlockPII(pw,remember){
  const r=await fetch(PII_URL+"?_="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("rede");
  const j=await r.json(),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(j.s),iterations:j.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  let pt;try{pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(j.iv)},key,b64(j.ct));}catch(e){throw new Error("senha");}
  PII=JSON.parse(new TextDecoder().decode(pt)).leads;
  try{(remember?localStorage:sessionStorage).setItem(PW_KEY,pw);}catch(e){}
}
function lockPII(){PII=null;try{localStorage.removeItem(PW_KEY);sessionStorage.removeItem(PW_KEY);}catch(e){}renderCRM();}
function lockDialog(){
  const d=document.createElement("div");d.className="lockbg";
  d.innerHTML=`<form class="lockdlg" role="dialog" aria-modal="true" aria-labelledby="lockT">
    <h3 id="lockT">Ver nomes e e-mails dos leads</h3>
    <p>A lista fica protegida porque o painel é aberto para quem tem o link. Digite a senha que a Corvo passou para o time.</p>
    <input type="password" id="lockPw" autocomplete="current-password" placeholder="Senha" required aria-label="Senha">
    <label class="lockrem"><input type="checkbox" id="lockRem"> Lembrar neste aparelho</label>
    <div class="lockerr" id="lockErr" role="alert"></div>
    <div class="lockbtns"><button type="button" id="lockNo">Cancelar</button><button type="submit" id="lockGo">Desbloquear</button></div></form>`;
  document.body.appendChild(d);
  const pw=d.querySelector("#lockPw"),close=()=>d.remove();pw.focus();
  d.querySelector("#lockNo").onclick=close;d.onclick=e=>{if(e.target===d)close();};
  d.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
  d.querySelector("form").onsubmit=async e=>{e.preventDefault();const b=d.querySelector("#lockGo");b.disabled=true;b.textContent="Abrindo…";
    try{await unlockPII(pw.value,d.querySelector("#lockRem").checked);close();renderCRM();}
    catch(err){d.querySelector("#lockErr").textContent=err.message==="senha"?"Senha incorreta.":"Não consegui baixar a lista agora. Tente de novo em instantes.";b.disabled=false;b.textContent="Desbloquear";}};
}
(function(){let pw=null,rem=false;try{pw=localStorage.getItem(PW_KEY);rem=!!pw;pw=pw||sessionStorage.getItem(PW_KEY);}catch(e){}
  if(pw)unlockPII(pw,rem).then(()=>{if(DATA&&state.action==="crm")renderCRM();}).catch(()=>{});})();
fetch("./rd.json?_="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;RD=rdDecode(d);if(DATA)render();}).catch(()=>{});
